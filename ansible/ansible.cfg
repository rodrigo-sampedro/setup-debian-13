# ansible.cfg
# Ansible configuration for Debian 13 VPS Setup

[defaults]
# Inventory
[defaults]
#INVENTORY = inventory
# TODO: check how build know_host file for avoid this step
host_key_checking = FASLE
inventory = ./inventory/hosts
host_key_checking = False

# Roles path
roles_path = ./roles

# Vault
vault_password_file = .vault_pass  # Optional: remove if using --ask-vault-pass

# SSH
remote_user = root
private_key_file = ~/.ssh/id_rsa
timeout = 30
remote_tmp = /tmp/.ansible-${USER}/tmp

# Performance
forks = 5
gather_timeout = 30
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_facts
fact_caching_timeout = 3600

# Output
stdout_callback = yaml
bin_ansible_callbacks = True
display_args_to_stdout = False
display_skipped_hosts = True
force_color = True

# Logging
log_path = ./ansible.log

# Privilege escalation
become = True
become_method = sudo
become_user = root
become_ask_pass = False

# Retry
retry_files_enabled = True
retry_files_save_path = ./retry

# Deprecation warnings
deprecation_warnings = True
command_warnings = True

# Performance optimizations
pipelining = True
ssh_args = -o UserKnownHostsFile=./ansible_ssh_known_host -o ControlMaster=auto -o ControlPersist=60s -o PreferredAuthentications=publickey

[inventory]
enable_plugins = host_list, script, auto, yaml, ini, toml

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ForwardAgent=yes
pipelining = True
control_path = /tmp/ansible-ssh-%%h-%%p-%%r
