# ansible.cfg
# Ansible configuration for Debian 13 VPS Setup

[defaults]
inventory = ./inventory/hosts.yaml
host_key_checking = True

# Roles path
roles_path = ./roles

# Vault
# Prefer --ask-vault-pass or an external secret manager. Do not commit .vault_pass.

# SSH
remote_user = debian
private_key_file = ~/.ssh/id_ed25519
timeout = 30
remote_tmp = /tmp/.ansible-${USER}/tmp

# Performance
forks = 5
gather_timeout = 30
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_facts
fact_caching_timeout = 3600

# Output
stdout_callback = yaml
bin_ansible_callbacks = True
display_args_to_stdout = False
display_skipped_hosts = True
force_color = True

# Logging
log_path = ./ansible.log

# Privilege escalation
become = True
become_method = sudo
become_user = root
become_ask_pass = False

# Retry
retry_files_enabled = True
retry_files_save_path = ./retry

# Deprecation warnings
deprecation_warnings = True
command_warnings = True

# Performance optimizations
pipelining = True
ssh_args = -o UserKnownHostsFile=./ansible_ssh_known_hosts -o ControlMaster=auto -o ControlPersist=60s -o PreferredAuthentications=publickey,password

[inventory]
enable_plugins = host_list, script, auto, yaml, ini, toml

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
pipelining = True
control_path = /tmp/ansible-ssh-%%h-%%p-%%r
