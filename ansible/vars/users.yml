---
# vars/users.yml - User management configuration

# SSH Allowed Users. administrator is deliberately excluded from direct SSH.
ssh_allowed_users:
  - deployer
  - tuUser

# Users are created without password defaults. Authorized keys and optional
# password hashes must come from encrypted Vault variables or host-local input.
system_users:
  - name: administrator
    password_lock: true
    groups: []
    authorized_keys: "{{ vault_administrator_authorized_keys | default([]) }}"
    ssh_key_url: ""
    shell: /bin/bash
    
  - name: deployer
    password_lock: true
    groups:
      - "{{ docker_deploy_group }}"
    authorized_keys: "{{ vault_deployer_authorized_keys | default([]) }}"
    ssh_key_url: ""
    shell: /bin/bash

# Sudo Policies
# sudoers_policy options:
#   - ALL: full sudo access with password
#   - NOPASSWD_ALL: full sudo without password
#   - DOCKER_ONLY: only docker helper scripts
sudo_policies:
  - user: administrator
    policy: NOPASSWD_ALL
  - user: deployer
    policy: "{{ 'NOPASSWD_ALL' if bootstrap_deployer_root else 'DOCKER_ONLY' }}"
    commands:
      - /usr/local/bin/docker-deploy
      - /usr/local/bin/docker-manage
  - user: tuUser
    policy: ALL

# Sudo rule templates
sudo_templates:
  ALL: "ALL=(ALL) ALL"
  NOPASSWD_ALL: "ALL=(ALL) NOPASSWD:ALL"
  DOCKER_ONLY: "ALL=(ALL) NOPASSWD:{{ item.commands | join(',') }}"
