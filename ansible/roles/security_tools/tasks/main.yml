---
# roles/security_tools/tasks/main.yml
# Install and configure security tools: ClamAV, Rkhunter, Endlessh

- name: Include ClamAV tasks
  include_tasks: clamav.yml
  tags: clamav

- name: Include Rkhunter tasks
  include_tasks: rkhunter.yml
  tags: rkhunter

- name: Include Endlessh tasks
  include_tasks: endlessh.yml
  tags: endlessh

