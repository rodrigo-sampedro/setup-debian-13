---
# roles/geoip/tasks/main.yml
# GeoIP blocking configuration for Fail2ban

- name: Install GeoIP tools
  apt:
    name:
      - geoip-bin
      - geoip-database
    state: present

- name: Create GeoIP filter for fail2ban
  copy:
    content: |
      [Definition]
      failregex = ^.*<HOST>.*$
      ignoreregex =
    dest: /etc/fail2ban/filter.d/geoip.conf
    owner: root
    group: root
    mode: '0644'
  notify: restart fail2ban

- name: Create GeoIP action for fail2ban
  template:
    src: geoip-action.conf.j2
    dest: /etc/fail2ban/action.d/geoip.conf
    owner: root
    group: root
    mode: '0644'
  notify: restart fail2ban

- name: Add GeoIP jail to fail2ban
  blockinfile:
    path: /etc/fail2ban/jail.local
    marker: "# {mark} ANSIBLE MANAGED - GeoIP blocking"
    block: |
      
      [geoip-sshd]
      enabled = true
      filter = geoip
      action = geoip
      logpath = /var/log/auth.log
      maxretry = 1
      bantime = -1
      findtime = 86400
    backup: yes
  notify: restart fail2ban

- name: Display GeoIP configuration
  debug:
    msg:
      - "GeoIP blocking configured"
      - "Blocked countries: {{ blocked_countries | join(', ') }}"
