---
# roles/users/tasks/main.yml
# User management and SSH keys

- name: Create docker_deploy group
  group:
    name: "{{ docker_deploy_group }}"
    state: present

- name: Create system users
  user:
    name: "{{ item.name }}"
    password: "{{ item.password_hash | default(omit) }}"
    password_lock: "{{ item.password_lock | default(true) }}"
    groups: "{{ item.groups | default([]) + (['sudo'] if item.name == 'deployer' and bootstrap_deployer_root else []) }}"
    shell: "{{ item.shell | default('/bin/bash') }}"
    create_home: yes
    state: present
  loop: "{{ system_users }}"
  no_log: yes

- name: Ensure key-only users are not account-locked
  user:
    name: "{{ item.name }}"
    password_lock: false
  loop: "{{ system_users }}"
  when:
    - not item.password_lock | default(true)
    - item.password_hash is not defined
  no_log: yes

- name: Setup SSH directories
  file:
    path: "/home/{{ item.name }}/.ssh"
    state: directory
    owner: "{{ item.name }}"
    group: "{{ item.name }}"
    mode: '0700'
  loop: "{{ system_users }}"

- name: Install SSH authorized keys
  copy:
    content: "{{ (item.authorized_keys | default([])) | join('\n') }}\n"
    dest: "/home/{{ item.name }}/.ssh/authorized_keys"
    owner: "{{ item.name }}"
    group: "{{ item.name }}"
    mode: '0600'
  loop: "{{ system_users }}"
  when: item.authorized_keys | default([]) | length > 0

- name: Configure sudo policies
  template:
    src: sudoers.j2
    dest: "/etc/sudoers.d/{{ item.user }}"
    owner: root
    group: root
    mode: '0440'
    validate: 'visudo -cf %s'
  loop: "{{ sudo_policies }}"

- name: Setup Docker aliases for users
  blockinfile:
    path: "/home/{{ item.name }}/.bashrc"
    owner: "{{ item.name }}"
    group: "{{ item.name }}"
    mode: '0644'
    marker: "# {mark} ANSIBLE MANAGED - Docker aliases"
    block: |
      # Docker helper aliases
      alias dp='docker-deploy'
      alias dm='docker-manage'
      
      # Show last login
      if [ -f ~/.last_login ]; then
          echo "Last login: $(cat ~/.last_login)"
      fi
      echo "$(date '+%Y-%m-%d %H:%M:%S from '$(echo $SSH_CONNECTION | awk '{print $1}'))" > ~/.last_login
  loop: "{{ system_users }}"